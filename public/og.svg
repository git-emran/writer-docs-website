<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66e3ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="270" cy="120" r="180" fill="#66e3ff" opacity="0.20" filter="url(#blur)"/>
  <circle cx="980" cy="210" r="210" fill="#a78bfa" opacity="0.18" filter="url(#blur)"/>

  <rect x="88" y="86" width="1024" height="458" rx="36" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>

  <g transform="translate(130 150)">
    <rect x="0" y="0" width="64" height="64" rx="18" fill="url(#g)" stroke="rgba(102,227,255,0.35)"/>
    <text x="32" y="41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="28" fill="rgba(2,6,23,0.88)">W</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" fill="rgba(255,255,255,0.92)">
    <text x="220" y="205" font-size="56" font-weight="800" letter-spacing="-0.02em">Writr</text>
    <text x="220" y="265" font-size="26" fill="rgba(255,255,255,0.74)">
      Local-first Markdown notes with Canvas, Kanban, and Terminal
    </text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" fill="rgba(255,255,255,0.80)" font-size="18">
    <text x="220" y="326">~/Writr · files on disk · optional AI</text>
  </g>
</svg>

